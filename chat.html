<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hippo AI Chat</title>

<link rel="stylesheet" href="chat.css">
</head>

<body>

<div class="app-layout">

    <!-- 左侧 -->
    <div class="sidebar">

        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">
                + New Chat
            </button>
        </div>

        <div id="chatList" class="chat-list"></div>

    </div>

    <!-- 主区 -->
    <div class="chat-container">

        <!-- 顶部 -->
        <div class="topbar">

            <div class="brand">
                🦛 Hippo AI
                <span id="userEmail"></span>
            </div>

            <div class="actions">
                <button onclick="changePassword()">Change Password</button>
                <button onclick="logout()">Logout</button>
            </div>

        </div>

        <!-- 消息区 -->
        <div id="messages" class="messages"></div>

        <!-- 上传区（UI保留） -->
        <div class="upload-area">

            <input type="file" id="fileInput"
                   accept="image/png,image/jpeg,image/jpg,image/webp,.pdf">

            <div id="fileInfo" class="file-info">No file selected</div>

            <div class="upload-tip">
                Supports JPG, PNG, WEBP images.<br>
                PDF support coming soon.<br>
                Max size: 1MB
            </div>

        </div>

        <!-- 模型信息 -->
        <div class="model-bar">
            Model: GPT-5 Mini • Vision Ready
        </div>

        <!-- 输入区 -->
        <div class="input-area">

            <input id="input"
                   placeholder="Ask Hippo AI anything..."
                   autocomplete="off"
                   onkeydown="if(event.key==='Enter')sendMessage()">

            <button onclick="sendMessage()">Send</button>

        </div>

    </div>

</div>

<!-- ⚠️ 只保留一个JS入口 -->
<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hippo AI</title>

<link rel="stylesheet" href="style.css">

<style>
/* 简单补充：切换按钮 */
.switch {
    margin-top: 10px;
    font-size: 13px;
    color: #666;
    cursor: pointer;
    text-align: center;
}
.switch:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="page">

    <!-- 左侧 -->
    <div class="left">

        <div class="hippo-wrap">
            <svg width="110" height="110" viewBox="0 0 24 24" fill="none">
                <path d="M6 10c0-3 2.5-5 6-5s6 2 6 5v4c0 3-2.5 5-6 5s-6-2-6-5v-4z"
                      fill="#1a73e8"/>
                <circle cx="9" cy="12" r="1" fill="white"/>
                <circle cx="15" cy="12" r="1" fill="white"/>
            </svg>
        </div>

        <h1 class="brand">Hippo AI</h1>
        <p class="desc">A simple, fast AI assistant built for you.</p>

    </div>

    <!-- 右侧 -->
    <div class="right">

        <div class="card">

            <h2 id="title">Welcome back</h2>
            <p class="sub" id="sub">Sign in to continue</p>

            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">

            <button onclick="submitAuth()" id="btn">Sign in</button>

            <div class="forgot" onclick="forgotPassword()">
                Forgot password?
            </div>

            <div class="switch" onclick="toggleMode()">
                No account? Click to register
            </div>

            <div id="msg"></div>

        </div>

    </div>

</div>

<script>
let isLoginMode = true;

// =============================
// 切换 登录 / 注册
// =============================
function toggleMode() {
    isLoginMode = !isLoginMode;

    document.getElementById("title").innerText =
        isLoginMode ? "Welcome back" : "Create account";

    document.getElementById("sub").innerText =
        isLoginMode ? "Sign in to continue" : "Sign up to get started";

    document.getElementById("btn").innerText =
        isLoginMode ? "Sign in" : "Sign up";

    document.querySelector(".switch").innerText =
        isLoginMode ? "No account? Click to register" : "Already have account? Sign in";

    document.getElementById("msg").innerText = "";
}

// =============================
// 注册 + 登录统一入口
// =============================
async function submitAuth() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        document.getElementById("msg").innerText = "Please fill all fields";
        return;
    }

    const endpoint = isLoginMode
        ? "https://auth.hippo1996.top/api/login"
        : "https://auth.hippo1996.top/api/register";

    const res = await fetch(endpoint, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
        document.getElementById("msg").innerText =
            data.error || "Request failed";
        return;
    }

    // =============================
    // 注册成功
    // =============================
    if (!isLoginMode) {
        document.getElementById("msg").innerText =
            "Registration successful, please sign in";
        toggleMode();
        return;
    }

    // =============================
    // 登录成功
    // =============================
    localStorage.setItem("token", data.token);

    window.location.href = "chat.html";
}

// =============================
// 忘记密码（暂未实现）
// =============================
function forgotPassword() {
    document.getElementById("msg").innerText =
        "Password reset not implemented yet (next step we can add it)";
}
</script>

</body>
</html>

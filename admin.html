<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Hippo AI Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      font-family: Arial;
      padding: 20px;
      background: #111;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #444;
      padding: 10px;
      text-align: left;
    }

    select {
      padding: 5px;
    }

    button {
      padding: 5px 10px;
      cursor: pointer;
    }

  </style>
</head>

<body>

  <h1>🦛 Hippo AI Admin Panel</h1>

  <p id="status">Loading...</p>

  <table>

    <thead>
      <tr>
        <th>Email</th>
        <th>Role</th>
        <th>Usage</th>
        <th>Change Role</th>
      </tr>
    </thead>

    <tbody id="user-table">
    </tbody>

  </table>

<script>

const SUPABASE_URL =
  "https://komjwvwxeaqfnxfphxou.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1atUPorr5mJZO09jVcvkXw_v_dM7qPN";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

// ⚠️ 你的管理员邮箱
const ADMIN_EMAIL = "test1@test.com";

async function init() {

  // 获取当前用户
  const { data } =
    await supabaseClient.auth.getUser();

  const user = data.user;

  // 未登录
  if (!user) {

    document.body.innerHTML =
      "<h2>Please login first.</h2>";

    return;
  }

  // 非管理员
  if (user.email !== ADMIN_EMAIL) {

    document.body.innerHTML =
      "<h2>Access denied.</h2>";

    return;
  }

  document.getElementById("status")
    .innerText =
      "Admin: " + user.email;

  await loadUsers();
}

// 加载用户
async function loadUsers() {

  const table =
    document.getElementById("user-table");

  table.innerHTML = "";

  // 获取 profiles
  const { data: profiles } =
    await supabaseClient
      .from("user_profiles")
      .select("*");

  // 获取 usage
  const { data: usage } =
    await supabaseClient
      .from("message_usage")
      .select("*");

  // 获取 auth用户
  const {
    data: { users }
  } = await supabaseClient.auth.admin.listUsers();

  for (const user of users) {

    const profile =
      profiles.find(
        p => p.user_id === user.id
      );

    const usageData =
      usage.find(
        u => u.user_id === user.id
      );

    const role =
      profile?.role || "free";

    const count =
      usageData?.count || 0;

    const tr =
      document.createElement("tr");

    tr.innerHTML = `
      <td>${user.email}</td>

      <td>${role}</td>

      <td>${count}</td>

      <td>
        <select id="role-${user.id}">
          <option value="free">free</option>
          <option value="pro">pro</option>
          <option value="super">super</option>
        </select>

        <button onclick="changeRole('${user.id}')">
          Save
        </button>
      </td>
    `;

    table.appendChild(tr);

    // 默认选中
    document.getElementById(
      `role-${user.id}`
    ).value = role;
  }
}

// 修改角色
async function changeRole(userId) {

  const role =
    document.getElementById(
      `role-${userId}`
    ).value;

  await supabaseClient
    .from("user_profiles")
    .update({
      role: role
    })
    .eq("user_id", userId);

  alert("Role updated!");

  loadUsers();
}

init();

</script>

</body>
</html>
